<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon OrderFlow CI/CD Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">&#x1F504;</span>
          <div>
            <div class="brand-title">OrderFlow CI/CD</div>
            <div class="brand-sub">Amazon Edition</div>
          </div>
        </div>
        <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
      <div class="sidebar-progress">
        <div class="progress-label">
          <span>Progress</span>
          <span id="progress-count">0 / 12</span>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
      <nav id="nav-list"></nav>
      <div class="sidebar-footer">
        <div class="case-note">
          <div class="case-note-label">The Case</div>
          <div class="case-note-text">Follow Priya's fraud-score field from laptop to production &mdash; across Amazon's $1.3M/min order pipeline.</div>
        </div>
      </div>
    </aside>
    <main id="content">
      <div id="module-header">
        <div id="breadcrumb"></div>
        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn" title="Toggle theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
      <div id="module-canvas"></div>
    </main>
  </div>
  <div id="tooltip" class="tooltip hidden"></div>
  <script type="module" src="script.js"></script>
</body>
</html>
