name: DE Shorts content + render gate

on:
  pull_request:
    paths: ["de-shorts/**"]
  push:
    branches: [main]
    paths: ["de-shorts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: de-shorts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci || npm install
      - name: Typecheck tools
        run: npx tsc --noEmit
      - name: Validate content (schema + graph integrity)
        run: npm run validate

  render-gate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: de-shorts/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: 360x800 render gate
        run: npm run gate
