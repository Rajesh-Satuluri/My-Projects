name: Deploy GitHub Pages

on:
  push:
    branches:
      - claude/apache-flink-visualizer-f5tmg5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p /tmp/site/flink-visualizer
          cp -r flink-visualizer/. /tmp/site/flink-visualizer/
          cat > /tmp/site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=flink-visualizer/">
            <title>My Projects</title>
          </head>
          <body>
            <p>Redirecting to <a href="flink-visualizer/">Flink Visualizer</a>…</p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          publish_branch: gh-pages
          force_orphan: true
