name: Deploy My-Projects portfolio to GitHub Pages

on:
  push:
    branches:
      - "claude/iceberg-visualizer-v77ua8"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check iceberg-visualizer JS
        run: node iceberg-visualizer/scripts/check-syntax.mjs

      - name: Stage full portfolio
        run: |
          mkdir -p /tmp/site
          # Portfolio landing page + .nojekyll
          cp index.html .nojekyll /tmp/site/
          # Static project sites (each self-contained under its own path)
          for d in databricks db-engineering db-internals dbt flink kafka python snowflake python-companion; do
            cp -r "$d" /tmp/site/
          done
          # Unified Table Formats Visualizer (Iceberg + Delta + Compare)
          # served at /lakehouse/ (dev files stripped). Source folder keeps
          # its name; only the published path is renamed.
          rm -rf /tmp/site/lakehouse
          cp -r iceberg-visualizer /tmp/site/lakehouse
          rm -rf /tmp/site/lakehouse/node_modules \
                 /tmp/site/lakehouse/scripts \
                 /tmp/site/lakehouse/.verify-artifacts \
                 /tmp/site/lakehouse/package.json \
                 /tmp/site/lakehouse/package-lock.json \
                 /tmp/site/lakehouse/.gitignore \
                 /tmp/site/lakehouse/ENHANCEMENTS.md
          # Back-compat: /iceberg/ redirects to /lakehouse/, preserving the
          # hash so old deep links (e.g. /iceberg/#delta/home) keep working.
          mkdir -p /tmp/site/iceberg
          cat > /tmp/site/iceberg/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Moved to /lakehouse/</title>
            <link rel="canonical" href="../lakehouse/">
            <meta http-equiv="refresh" content="0; url=../lakehouse/">
            <script>location.replace('../lakehouse/' + (location.hash || ''));</script>
            <style>body{font-family:system-ui,sans-serif;background:#0a0e17;color:#c9d3e0;display:grid;place-items:center;height:100vh;margin:0}a{color:#4aaeff}</style>
          </head>
          <body>
            <p>This tool now lives at <a href="../lakehouse/">/lakehouse/</a> — redirecting…</p>
          </body>
          </html>
          HTML

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
