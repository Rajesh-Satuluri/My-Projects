name: Deploy GitHub Pages

on:
  push:
    branches:
      - claude/dbt-learning-module-e1393i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p /tmp/site-root
          # Root redirect to dbt visualizer
          echo '<meta http-equiv="refresh" content="0;url=dbt/">' > /tmp/site-root/index.html
          # dbt visualizer in /dbt subdirectory
          mkdir -p /tmp/site-root/dbt
          cp -r dbt-visualizer/. /tmp/site-root/dbt/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/site-root'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
