name: Deploy Iceberg Visualizer to GitHub Pages

on:
  push:
    branches:
      - "claude/iceberg-visualizer-v77ua8"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p /tmp/site
          cp -r iceberg-visualizer/. /tmp/site/
          cp -r python-companion /tmp/site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
