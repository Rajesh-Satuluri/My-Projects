name: Deploy GitHub Pages

on:
  push:
    branches:
      - claude/apache-flink-visualizer-f5tmg5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p /tmp/site/flink-visualizer
          cp -r flink-visualizer/. /tmp/site/flink-visualizer/
          cat > /tmp/site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=flink-visualizer/">
            <title>My Projects</title>
          </head>
          <body>
            <p>Redirecting to <a href="flink-visualizer/">Flink Visualizer</a>…</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
